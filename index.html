<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ganejo</title>
<meta name="description" content="Ganejo.com is under construction. Please check back soon.">
<style>
  :root { --bg: #f4f4f2; --fg: #1f2933; --muted: #5b6770; --line: #d6d6d2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16191c; --fg: #eceeef; --muted: #9aa4ab; --line: #2c3237; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { max-width: 520px; text-align: center; }
  h1 { font-size: 2.4rem; letter-spacing: 0.08em; margin: 0 0 12px; font-weight: 600; }
  .rule { width: 48px; height: 2px; background: var(--line); margin: 0 auto 20px; border: 0; }
  h2 { font-size: 1.15rem; font-weight: 500; margin: 0 0 10px; }
  p { color: var(--muted); line-height: 1.6; margin: 0; }
</style>
</head>
<body>
  <main>
    <h1>GANEJO</h1>
    <hr class="rule">
    <h2>This site is under construction</h2>
    <p>We are working on something new. Please check back soon.</p>
  </main>
</body>
</html>
